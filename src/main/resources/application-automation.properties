# Dev/CI automation profile. Activate alongside `local`, never on its own:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,automation
# (`automation` alone would drop `local` and with it the datasource.)
#
# It lets the sanctioned browser loop register the throwaway browser_loop_* account that
# fences its playthrough out of the frozen research aggregates. The exemption covers that
# prefix ONLY -- thesis_p* stays rejected under every profile, because that cohort is read
# back as data by /api/research/thesis/divergence rather than excluded from it.
#
# Production cannot reach this, three ways: the @Value default is false; docker-compose.yml
# sets no SPRING_PROFILES_ACTIVE, so the container's active profile stays `local`; and
# .dockerignore keeps this file out of the build context, so the key has no source in the
# image even if the profile were activated there. `./mvnw test` likewise runs under `local`
# alone, which is what proves the guard's default.
#
# Keep this file to the one key -- Boot rejects profile-activating properties
# (spring.profiles.active, spring.config.activate) inside a profile-specific document.
app.automation.allow-browser-loop-registration=true
