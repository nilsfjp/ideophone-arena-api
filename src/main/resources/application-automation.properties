# Dev/CI automation profile. Activate alongside `local`, never on its own:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,automation
#
# It lifts the A10 reserved-username-prefix rejection so the sanctioned browser loop can
# register the throwaway browser_loop_* account that fences its playthrough out of the
# frozen research aggregates. Production is unaffected: docker-compose.yml sets no
# SPRING_PROFILES_ACTIVE, so the container's active profile stays `local` (from
# application.properties) and this file is never loaded. `./mvnw test` likewise runs under
# `local` alone, which is what proves the guard's default.
#
# Keep this file to the one key -- Boot rejects profile-activating properties
# (spring.profiles.active, spring.config.activate) inside a profile-specific document.
app.automation.allow-reserved-registration=true
